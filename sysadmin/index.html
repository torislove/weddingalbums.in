<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>weddingalbums.in System Administration Console</title>
    <meta name="title" content="weddingalbums.in System Administration Console" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#d4af37" />
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:#08080c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;color:#f4f4f5;">
        <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(14,165,233,0.25);border-top-color:#0ea5e9;animation:preloaderSpin 1.1s cubic-bezier(0.6,0.2,0.4,1) infinite;"></div>
          <div style="position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(14,165,233,0.45);animation:preloaderSpinReverse 16s linear infinite;"></div>
          <svg width="30" height="30" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="14" stroke="#0ea5e9" stroke-width="1.5" opacity="0.8" />
            <circle cx="18" cy="18" r="4.5" fill="#0ea5e9" style="animation:preloaderPulse 2.4s ease-in-out infinite;" />
          </svg>
        </div>
        <div style="margin-top:20px;font-family:'Playfair Display',Georgia,serif;font-size:16px;letter-spacing:3px;font-weight:700;color:#0ea5e9;text-transform:uppercase;">
          weddingalbums.in
        </div>
        <div style="margin-top:8px;font-size:11px;color:rgba(14,165,233,0.7);letter-spacing:2px;text-transform:uppercase;font-weight:600;">
          SysAdmin · Operations Control Center
        </div>
        <div style="width:120px;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:24px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,#0ea5e9,transparent);animation:preloaderBar 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes preloaderSpin { to { transform: rotate(360deg); } }
        @keyframes preloaderSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes preloaderPulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.25); opacity: 1; } }
        @keyframes preloaderBar { 0% { left: -40%; } 100% { left: 100%; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
