    <circle cx="600" cy="430" r="150" fill="url(#emboss)"/>
    <g fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="2">
      <circle cx="600" cy="430" r="150"/>
      <circle cx="600" cy="430" r="118"/>
      <circle cx="600" cy="430" r="64"/>
      <g id="petalring">
        <path d="M600 280 C 628 340, 628 380, 600 436 C 572 380, 572 340, 600 280 Z"/>
        <path d="M600 580 C 628 520, 628 480, 600 424 C 572 480, 572 520, 600 580 Z"/>
        <path d="M450 430 C 510 402, 550 402, 606 430 C 550 458, 510 458, 450 430 Z"/>
        <path d="M750 430 C 690 402, 650 402, 594 430 C 650 458, 690 458, 750 430 Z"/>
        <path d="M491 321 C 556 330, 589 352, 606 376 C 578 396, 536 396, 491 321 Z"/>
        <path d="M709 321 C 644 330, 611 352, 594 376 C 622 396, 664 396, 709 321 Z"/>
        <path d="M491 539 C 556 530, 589 508, 606 484 C 578 464, 536 464, 491 539 Z"/>
        <path d="M709 539 C 644 530, 611 508, 594 484 C 622 464, 664 464, 709 539 Z"/>
      </g>
    </g>
    <circle cx="600" cy="430" r="26" fill="#d4af37" fill-opacity="0.85"/>

    <text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="10" fill="none" stroke="#d4af37" stroke-width="1.2" text-anchor="middle">KALYANAM</text>
    <text x="600" y="740" font-family="'Segoe UI', Arial, sans-serif" font-size="13" letter-spacing="7" fill="#9fb0b8" text-anchor="middle">ITALIAN LEATHERETTE · GOLD FOIL</text>
    <text x="600" y="766" font-family="'Segoe UI', Arial, sans-serif" font-size="12" letter-spacing="5" fill="#6f8088" text-anchor="middle">WEDDINGALBUMS.IN</text>
