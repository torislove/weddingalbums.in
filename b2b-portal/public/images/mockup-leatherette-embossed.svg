  <!-- annotations -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="48" y="72" font-size="17" letter-spacing="4" fill="#d4af37">WEDDINGALBUMS.IN</text>
    <text x="48" y="98" font-size="30" font-family="Georgia, serif" fill="#f4ede1">Embossed Leatherette · 12 × 18 in</text>
    <rect x="886" y="52" width="272" height="64" rx="32" fill="rgba(212,175,55,0.12)" stroke="#d4af37"/>
    <text x="1022" y="80" font-size="15" letter-spacing="2" fill="#d4af37" text-anchor="middle">DEBOSSED FOIL</text>
    <text x="1022" y="102" font-size="13" fill="#9c8b64" text-anchor="middle">custom monogram · 40+ shades</text>
