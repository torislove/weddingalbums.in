    <radialGradient id="emboss" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="rgba(255,215,120,0.28)"/>
      <stop offset="70%" stop-color="rgba(255,215,120,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,215,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="950" fill="url(#bgGlow3)"/>
  <ellipse cx="600" cy="806" rx="380" ry="30" fill="rgba(0,0,0,0.55)"/>

