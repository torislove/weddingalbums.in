<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-label="Embossed Italian leatherette album mockup — WeddingAlbums.in">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b1b25"/>
      <stop offset="65%" stop-color="#0d0d13"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <linearGradient id="lthr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#161e22"/>
    </linearGradient>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="none"/>
      <circle cx="6" cy="6" r="1.1" fill="rgba(255,255,255,0.045)"/>
      <circle cx="18" cy="14" r="0.9" fill="rgba(255,255,255,0.035)"/>
      <circle cx="10" cy="21" r="1.0" fill="rgba(255,255,255,0.03)"/>
      <circle cx="22" cy="4" r="0.8" fill="rgba(255,255,255,0.03)"/>
