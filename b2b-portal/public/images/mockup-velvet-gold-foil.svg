<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-label="Royal velvet hardcover with 24K gold debossed foil mockup — WeddingAlbums.in">
  <defs>
    <radialGradient id="vgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b1b25"/>
      <stop offset="65%" stop-color="#0d0d13"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c1f24"/>
      <stop offset="45%" stop-color="#43161b"/>
      <stop offset="100%" stop-color="#2a0e12"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e2a0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8f6b1d"/>
    </linearGradient>
    <pattern id="velvetFuzz" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <circle cx="2" cy="2" r="0.5" fill="rgba(255,220,230,0.05)"/>
      <circle cx="6" cy="5" r="0.4" fill="rgba(255,220,230,0.045)"/>
    </pattern>
  </defs>

  <rect width="1200" height="950" fill="url(#vgGlow)"/>
  <ellipse cx="600" cy="806" rx="380" ry="30" fill="rgba(0,0,0,0.55)"/>

  <g>
    <rect x="350" y="140" width="500" height="680" rx="6" fill="url(#velvet)"/>
    <rect x="350" y="140" width="500" height="680" rx="6" fill="url(#velvetFuzz)"/>
    <rect x="350" y="140" width="500" height="680" rx="6" fill="none" stroke="#7a2f36" stroke-width="2"/>

    <!-- debossed gold foil border + monogram -->
    <rect x="388" y="178" width="424" height="604" fill="none" stroke="url(#foil)" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
    <g fill="none" stroke="url(#foil)" stroke-width="2.4">
      <circle cx="600" cy="420" r="118"/>
      <circle cx="600" cy="420" r="86"/>
      <g>
        <path d="M600 336 C 622 382, 622 408, 600 456 C 578 408, 578 382, 600 336 Z"/>
        <path d="M600 504 C 622 458, 622 432, 600 384 C 578 432, 578 458, 600 504 Z"/>
        <path d="M516 420 C 562 398, 588 398, 636 420 C 588 442, 562 442, 516 420 Z"/>
        <path d="M684 420 C 638 398, 612 398, 564 420 C 612 442, 638 442, 684 420 Z"/>
      </g>
    </g>
    <circle cx="600" cy="420" r="22" fill="url(#foil)"/>

    <!-- foil deboss labels -->
    <text x="600" y="648" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="12" fill="url(#foil)" text-anchor="middle">KALYANAM</text>
    <text x="600" y="690" font-family="Nirmala UI, Noto Serif Telugu, sans-serif" font-size="15" fill="rgba(248,238,208,0.75)" text-anchor="middle">శుభ దంపతులు · കല്യാണം</text>
    <text x="600" y="740" font-family="'Segoe UI', Arial" font-size="12" letter-spacing="6" fill="#b09669" text-anchor="middle">ROYAL VELVET · 24K DEBOSS</text>
  </g>

  <!-- gold clipping seam -->
  <rect x="350" y="640" width="500" height="2.5" fill="url(#foil)" opacity="0.6"/>

  <!-- annotations -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="48" y="72" font-size="17" letter-spacing="4" fill="#d4af37">WEDDINGALBUMS.IN</text>
    <text x="48" y="98" font-size="30" font-family="Georgia, serif" fill="#f4ede1">Royal Velvet + 24K Gold Foil · 12 × 18 in</text>
    <rect x="886" y="52" width="272" height="64" rx="32" fill="rgba(212,175,55,0.12)" stroke="#d4af37"/>
    <text x="1022" y="80" font-size="15" letter-spacing="2" fill="#d4af37" text-anchor="middle">QUEEN FINISH</text>
    <text x="1022" y="102" font-size="13" fill="#9c8b64" text-anchor="middle">debossed · telugu calligraphy ok</text>
  </g>
</svg>
