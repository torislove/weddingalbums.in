# ==============================================================================
# NGINX High-Performance Configuration for WeddingAlbums.in (Oracle Cloud / Production)
# ==============================================================================
# Install Path: /etc/nginx/sites-available/weddingalbums.in
# Symlink: sudo ln -sf /etc/nginx/sites-available/weddingalbums.in /etc/nginx/sites-enabled/
# SSL Command: sudo certbot --nginx -d weddingalbums.in -d www.weddingalbums.in -d api.weddingalbums.in -d studio.weddingalbums.in -d creator.weddingalbums.in -d ops.weddingalbums.in -d cms.weddingalbums.in
# ==============================================================================

# Gzip Compression for Blazing Fast Loading
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# ------------------------------------------------------------------------------
# 1. MAIN CLIENT PORTAL (B2C) — weddingalbums.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name weddingalbums.in www.weddingalbums.in;
    root /var/www/weddingalbums/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND API — api.weddingalbums.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.weddingalbums.in;

    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real client IPs for security and audit logging
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file uploads (receipts, avatars, proofs)
    location /uploads {
        alias /var/www/weddingalbums/server/uploads;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

