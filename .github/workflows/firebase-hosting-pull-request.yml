name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: |
          cd server && npm install --no-audit && cd ..
          cd client && npm install --no-audit && cd ..
          cd b2b-portal && npm install --no-audit && cd ..
          cd editor-portal && npm install --no-audit && cd ..
          cd sysadmin && npm install --no-audit && cd ..
          cd uiadmin && npm install --no-audit && cd ..
      - name: Build All Frontends
        run: node build-all-unified.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEDDINGALBUMS_B4BCD }}
          projectId: weddingalbums-b4bcd
