name: WeddingAlbums CI/CD Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build All Portals & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install All Portal Dependencies
        run: |
          echo "Installing root dependencies..."
          if [ -f package.json ]; then npm install --no-audit; fi

          echo "Installing server dependencies..."
          cd server && npm install --no-audit && cd ..
          
          echo "Installing client dependencies..."
          cd client && npm install --no-audit && cd ..
          
          echo "Installing b2b-portal dependencies..."
          cd b2b-portal && npm install --no-audit && cd ..
          
          echo "Installing editor-portal dependencies..."
          cd editor-portal && npm install --no-audit && cd ..
          
          echo "Installing sysadmin dependencies..."
          cd sysadmin && npm install --no-audit && cd ..
          
          echo "Installing uiadmin dependencies..."
          cd uiadmin && npm install --no-audit && cd ..

      - name: 🏗️ Build All Frontends (Unified Assembly)
        run: |
          node build-all-unified.mjs

      - name: 🚀 Deploy via Service Account (Push to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEDDINGALBUMS_B4BCD }}
          channelId: live
          projectId: weddingalbums-b4bcd
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEDDINGALBUMS_B4BCD != '' }}

      - name: 🚀 Deploy via Firebase CLI Token (Push to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_FIREBASE_TOKEN == 'true'
        run: |
          npx firebase-tools deploy --only functions,hosting --force --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}

      - name: ℹ️ Deployment Secret Notice
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SERVICE_ACCOUNT != 'true' && env.HAS_FIREBASE_TOKEN != 'true'
        run: |
          echo "⚠️ Notice: Build completed successfully!"
          echo "To allow GitHub Actions to deploy to Firebase, add either:"
          echo "1. FIREBASE_SERVICE_ACCOUNT_WEDDINGALBUMS_B4BCD (via 'firebase init hosting:github')"
          echo "2. OR FIREBASE_TOKEN (via 'firebase login:ci')"
          echo "in GitHub Repository Settings -> Secrets and variables -> Actions."
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEDDINGALBUMS_B4BCD != '' }}
          HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
